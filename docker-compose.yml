services:
  # ----------------------------------------------------
  # Frontend Application (React SPA + Nginx)
  # ----------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dentabook_client
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dentabook_network

  # ----------------------------------------------------
  # Backend API (Node.js 22 + Express 4)
  # ----------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dentabook_api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dentabook_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-dentabook_db}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dentabook_network
      - database_network

  # ----------------------------------------------------
  # Database (PostgreSQL 16 Alpine)
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dentabook_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:-dentabook_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-dentabook_db}
    volumes:
      - dentabook_pgdata:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expose only to host loopback for direct debugging if needed
      - "127.0.0.1:${HOST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dentabook_user} -d ${DB_NAME:-dentabook_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - database_network

# ----------------------------------------------------
# Networks & Persistent Volumes
# ----------------------------------------------------
networks:
  dentabook_network:
    driver: bridge
  database_network:
    driver: bridge
    internal: true

volumes:
  dentabook_pgdata:
    driver: local

