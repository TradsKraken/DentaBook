# Public patient/clinic listener. Administrator routes are blocked.
server {
    listen 80;
    include /etc/nginx/portals/common.conf;
    location ~* ^/admin(/|$) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
# Administration listener. No patient or clinic pages are served.
server {
    listen 82;
    include /etc/nginx/portals/common.conf;
    location = / { return 302 /admin/sign-in; }
    location ~ ^/admin(?:/|$) { try_files $uri /index.html; }
    location / { return 404; }
}
