server_name _;
server_tokens off;
# Keep redirects relative to the browser origin behind Docker and HTTPS proxies.
absolute_redirect off;
root /usr/share/nginx/html;
index index.html;
client_max_body_size 100k;
gzip on;
gzip_types text/css text/javascript application/javascript application/json;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
location ^~ /api/ {
    proxy_pass http://$portal_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}
location ^~ /assets/ { expires 30d; try_files $uri =404; }
location ^~ /branding/ { try_files $uri =404; }
location ^~ /images/ { try_files $uri =404; }
location ^~ /fonts/ { try_files $uri =404; }
# Staff SPA fallbacks are internal, so /index.html cannot bypass portal routes.
location = /index.html { internal; }
